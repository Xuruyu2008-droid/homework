const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ================= 音效（WebAudio 合成） ================= */
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return AC; }
function beep(freq, dur, type = 'sine', vol = .16, when = 0) {
  if (!soundOn) return; const ctx = ac(); if (!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + when;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  click: () => beep(920, .07, 'triangle'),
  ok: () => { beep(660, .12); beep(880, .16, 'sine', .16, .09); },
  combo: () => { beep(660, .1); beep(990, .14, 'sine', .14, .08); },
  no: () => { beep(196, .22, 'sawtooth', .10); beep(147, .26, 'sawtooth', .08, .1); },
  over: () => { beep(523, .14); beep(659, .14, 'sine', .15, .13); beep(784, .3, 'sine', .15, .27); },
  tick: () => beep(1200, .04, 'square', .05)
};

/* ================= 小黑精灵 · 喵喵叫 ================= */
function meow(kind) {
  if (!soundOn) return;
  const ctx = ac(); if (!ctx) return;
  const t0 = ctx.currentTime, happy = kind === 'happy';
  const dur = happy ? 0.62 : 0.92;

  const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
  const lfo = ctx.createOscillator(), lfog = ctx.createGain();
  o.type = 'sawtooth';
  if (happy) {
    o.frequency.setValueAtTime(430, t0);
    o.frequency.linearRampToValueAtTime(790, t0 + dur * 0.34);
    o.frequency.linearRampToValueAtTime(545, t0 + dur);
  } else {
    o.frequency.setValueAtTime(520, t0);
    o.frequency.linearRampToValueAtTime(330, t0 + dur * 0.42);
    o.frequency.linearRampToValueAtTime(195, t0 + dur);
  }
  lfo.frequency.value = happy ? 11 : 7;
  lfog.gain.value = happy ? 28 : 16;
  lfo.connect(lfog); lfog.connect(o.frequency);
  lp.type = 'lowpass';
  lp.frequency.value = happy ? 1500 : 1000;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(happy ? 0.26 : 0.20, t0 + 0.07);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(lp); lp.connect(g); g.connect(ctx.destination);
  o.start(t0); lfo.start(t0);
  o.stop(t0 + dur); lfo.stop(t0 + dur);

  if (happy) {
    const o2 = ctx.createOscillator(), g2 = ctx.createGain();
    o2.type = 'sine';
    o2.frequency.setValueAtTime(640, t0 + dur * 0.5);
    o2.frequency.linearRampToValueAtTime(1000, t0 + dur * 0.78);
    o2.frequency.linearRampToValueAtTime(720, t0 + dur * 1.28);
    g2.gain.setValueAtTime(0.0001, t0 + dur * 0.5);
    g2.gain.exponentialRampToValueAtTime(0.15, t0 + dur * 0.62);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + dur * 1.3);
    o2.connect(g2); g2.connect(ctx.destination);
    o2.start(t0 + dur * 0.5); o2.stop(t0 + dur * 1.33);
  }
}

/* ================= 出题 ================= */
const QN = 10, TIME_MS = 15000;
let S = null;
function weightedPool() {
  const arr = [];
  W.forEach((x, i) => {
    let s = 1;
    if (mastered.has(x.w)) s *= .18;
    if (wrong[x.w]) s *= 4.5;
    arr.push({ i, s: s * (0.7 + Math.random() * .8) });
  });
  arr.sort((a, b) => b.s - a.s);
  return arr.slice(0, 40).map(x => x.i);
}
function pickMode(id) {
  if (id === 'book') { renderBook(); show('view-book'); return; }
  if (id === 'stage') { renderStages(); show('view-stages'); return; }
  if (id === 'rank') { renderRank(); show('view-rank'); return; }
  if (id === 'review' && !Object.keys(wrong).length) { toast('错题本是空的，先去刷题吧！'); return; }
  startRound(id);
}

function buildQs(id, count, typeList) {
  let pool;
  if (id === 'review') {
    pool = shuffle(Object.keys(wrong).map(w => W.findIndex(x => x.w === w)).filter(i => i >= 0));
  } else {
    pool = shuffle(weightedPool());
  }
  const n = Math.min(count || QN, pool.length);
  const types = typeList || (id === 'review' ? ['cn', 'en', 'spell', 'listen'] : [id]);
  return pool.slice(0, n).map((wi, k) => ({ word: W[wi], type: types[k % types.length] }));
}

function startRound(id, opts) {
  opts = opts || {};
  const qs = buildQs(id, opts.count, opts.types);
  if (!qs.length) { toast('这里还没有可练的词，先去刷题吧！'); return; }
  const lives = opts.lives || 3;
  S = {
    mode: id, qs, idx: 0, score: 0, combo: 0, maxCombo: 0,
    lives, maxLives: lives, correct: 0, answered: 0, wrongList: [],
    timeLimit: opts.time || TIME_MS, stageN: opts.stageN || 0
  };
  show('view-quiz'); nextQ();
}

function distractors(word, key) {
  const same = W.filter(x => x.w !== word.w && x[key] !== word[key] && x.p === word.p);
  const other = W.filter(x => x.w !== word.w && x[key] !== word[key] && x.p !== word.p);
  return shuffle(same).concat(shuffle(other)).slice(0, 3).map(x => key === 'c' ? x.c : x.w);
}

/* ================= 答题界面 ================= */
let timer = null, tRemain = 0, locked = false;
function nextQ() {

      <div class="opts">${shuffle([q.word.w, ...distractors(q.word, 'w')]).map((o, i) =>
        `<button class="opt" data-ok="${o === q.word.w ? 1 : 0}"><span class="num">${i + 1}</span>${o}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div>`;
  } else if (q.type === 'listen') {

      <div class="opts">${shuffle([q.word.w, ...distractors(q.word, 'w')]).map((o, i) =>
        `<button class="opt" data-ok="${o === q.word.w ? 1 : 0}"><span class="num">${i + 1}</span>${o}</button>`).join('')}</div>
      <div class="feedback" id="fb"></div>`;
    const lp = $('#listenPlay');
    lp.addEventListener('click', () => { speak(q.word.w); });
    setTimeout(() => { if (!locked) speak(q.word.w); }, 420);
  } else {
    const letters = q.word.w.split('').map((ch, i) => i === 0 ? ch : '⬚').join(' ');
    card.innerHTML = `
      <div class="tag">拼写挑战</div>
      <div class="qword cn">“${q.word.c}”</div>
      <div class="qpos">${q.word.p} · ${q.word.w.length} 个字母 · 首字母已给</div>
      <div class="spell-box">
        <input id="spellInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入单词后回车">
        <button class="btn teal" id="spellGo">提交</button>
      </div>
      <div class="hint-box">🧩 ${letters}</div>
      <div class="feedback" id="fb"></div>`;
    const inp = $('#spellInput');
    setTimeout(() => inp && inp.focus(), 60);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') $('#spellGo').click(); });
    $('#spellGo').addEventListener('click', () => judgeSpell(q));
  }
  card.classList.remove('qcard'); void card.offsetWidth; card.classList.add('qcard');
  card.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => judgeMCQ(q, b)));
  card.querySelectorAll('.speak').forEach(b => b.addEventListener('click', () => speak(b.dataset.say)));

  /* 计时 */
  tRemain = S.timeLimit;
  $('#timeBar').style.width = '100%';
  clearInterval(timer);
  timer = setInterval(() => {
    tRemain -= 100;
    $('#timeBar').style.width = Math.max(0, tRemain / S.timeLimit * 100) + '%';
    if (tRemain <= 3000 && tRemain % 500 === 0) sfx.tick();
    if (tRemain <= 0) { clearInterval(timer); timeUp(q); }
  }, 100);
}
function stopTimer() { clearInterval(timer); }

/* ================= 判定 ================= */
function baseJudge(q, ok) {
  stopTimer(); locked = true;
  S.answered++;
  const fb = $('#fb');
  if (ok) {
    S.correct++; S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo);
    const tb = Math.floor(tRemain / S.timeLimit * 5);
    const cb = Math.min(S.combo - 1, 4) * 2;
    S.score += 10 + tb + cb;
    fb.className = 'feedback ok';
    fb.textContent = `✅ 正确！ +${10 + tb + cb} 分${cb ? `（连击加成 +${cb}）` : ''}${tb >= 4 ? ' ⚡快准狠' : ''}`;
    if (S.combo >= 3) sfx.combo();
    meow('happy'); setSpirit('happy');
    delete wrong[q.word.w];
    $('#hScore').textContent = S.score;
  } else {
    S.combo = 0; S.lives--;
    S.wrongList.push(q.word);
    wrong[q.word.w] = (wrong[q.word.w] || 0) + 1;
    fb.className = 'feedback no';
    fb.innerHTML = `❌ 正确答案：<b style="margin-left:4px">${q.word.w} ${q.word.p} ${q.word.c}</b>`;
    meow('sad'); setSpirit('sad');
  }
  $('#hHearts').textContent = '❤️'.repeat(Math.max(0, S.lives)) + '🖤'.repeat(Math.max(0, S.maxLives - S.lives));
  store.set('cet4_wrong', wrong);
  /* 关键：先推进题号，再进入下一题，避免同一题重复 */
  setTimeout(() => { S.idx++; nextQ(); }, ok ? 950 : 2100);
}
function judgeMCQ(q, btn) {
  if (locked) return; locked = true;
  const ok = btn.dataset.ok === '1';
  document.querySelectorAll('#qCard .opt').forEach(b => {
    if (b.dataset.ok === '1') b.classList.add('right');
    else if (b === btn) b.classList.add('wrongpick');
  });
  baseJudge(q, ok);
}
function judgeSpell(q) {
  if (locked) return;
  const v = $('#spellInput').value.trim().toLowerCase();
  if (!v) return;
  const ok = v === q.word.w.toLowerCase();
  const inp = $('#spellInput');
  inp.disabled = true;
  if (!ok) inp.style.borderColor = 'var(--bad)';
  baseJudge(q, ok);
}
function timeUp(q) {
  if (locked) return;
  document.querySelectorAll('#qCard .opt').forEach(b => { if (b.dataset.ok === '1') b.classList.add('right'); });
  const inp = $('#spellInput'); if (inp) inp.disabled = true;
  baseJudge(q, false);
}

/* ================= 结算 ================= */
function endRound() {
  stopTimer();
  store.set('cet4_wrong', wrong);
  const acc = S.answered ? S.correct / S.answered : 0;

  if (S.answered > 0 && (!best[S.mode] || S.score > best[S.mode])) {
    best[S.mode] = S.score; store.set('cet4_best', best);
  }

  /* 闯关判定 */
  let stageNote = '', stagePassed = false, stageNext = 0;
  if (S.mode === 'stage' && S.stageN) {
    const st = STAGES.find(x => x.n === S.stageN);
    stagePassed = S.lives > 0 && acc >= st.pass;
    if (stagePassed) {
      if (!stageProg.cleared.includes(st.n)) stageProg.cleared.push(st.n);
      const nextN = st.n + 1;
      if (nextN <= STAGES.length && stageProg.unlocked < nextN) stageProg.unlocked = nextN;
      if (nextN <= STAGES.length) {
        stageNext = nextN;
        stageNote = `通关成功！已解锁第 ${nextN} 关 · ${STAGES.find(x => x.n === nextN).name}`;
      } else {
        stageNote = '恭喜通关全部六关！森林之心已点亮 🌳';
      }
      saveStageProg();
    } else {
      stageNote = S.lives <= 0
        ? `心用完了…需要 ${Math.round(st.pass * 100)}% 正确率才能通关，再来一次吧`
        : `正确率 ${Math.round(acc * 100)}%，还差一点达到 ${Math.round(st.pass * 100)}% 通关线`;
    }
  }

  let g = 'C', gname = '别灰心，错题本已记录，再战一轮！';
  if (acc === 1 && S.answered >= S.qs.length) { g = 'S'; gname = '完美通关！你太强了！'; }
  else if (acc >= .8) { g = 'A'; gname = '表现出色！离 S 只差一步'; }
  else if (acc >= .6) { g = 'B'; gname = '不错的开局，继续巩固'; }
  if (S.mode === 'stage' && stagePassed) { g = stageNext ? 'A' : 'S'; gname = '闯关成功，继续前进！'; }

  const gr = $('#rGrade'); gr.textContent = g; gr.className = 'grade ' + (g === 'S' ? 's' : '');
  $('#rTitle').textContent = S.mode === 'stage'
    ? (stagePassed ? '🎉 闯关成功' : '💧 闯关失败')
    : (S.lives <= 0 ? '🫀 心用完了…' : '🎉 本轮完成');
  $('#rScore').textContent = S.score;
  $('#rAcc').textContent = Math.round(acc * 100) + '%';
  $('#rCombo').textContent = S.maxCombo;
  $('#rNote').textContent = stageNote || gname;

  const bs = $('#btnNextStage');
  const showNext = S.mode === 'stage' && stagePassed && stageNext > 0;
  bs.classList.toggle('hidden', !showNext);
  bs.dataset.next = stageNext;

  /* 排行榜记录 */
  if (S.answered > 0 && S.score > 0) {
    saveRank({
      name: nickname || '匿名小黑', score: S.score, acc,
      mode: S.mode === 'stage' ? `第${S.stageN}关·闯关` : (MODE_NAME[S.mode] || '挑战'),
      ts: Date.now()
    });
  }

  const box = $('#rWrongBox'), list = $('#rWrongList');
  if (S.wrongList.length) {
    box.classList.remove('hidden');
    list.innerHTML = S.wrongList.map(x => `
      <div class="wrong-item"><b>${x.w}</b><span>${x.p} ${x.c}</span>
      <button class="icon-btn" data-say="${x.w}">🔊</button></div>`).join('');
    list.querySelectorAll('[data-say]').forEach(b => b.addEventListener('click', () => speak(b.dataset.say)));
  } else box.classList.add('hidden');
  sfx.over();
  show('view-result');
}

/* ================= 词书 ================= */
function renderBook(filter = '') {
  const f = filter.trim().toLowerCase();
  const rows = W.filter(x => !f || x.w.includes(f) || x.c.includes(f));
  $('#bookMastered').textContent = mastered.size;
  $('#bookTotal').textContent = W.length;
  $('#bookList').innerHTML = rows.slice(0, 300).map(x => `
    <div class="wrow ${mastered.has(x.w) ? 'mastered' : ''}">
      <span class="w">${x.w}</span>
      <span class="m">${x.p} ${x.c}</span>
      <button class="icon-btn" data-say="${x.w}">🔊</button>
      <button class="icon-btn star ${mastered.has(x.w) ? 'on' : ''}" data-star="${x.w}">★</button>
    </div>`).join('') || '<div style="padding:20px;text-align:center;color:var(--muted)">没有匹配的单词</div>';
  $('#bookList').querySelectorAll('[data-say]').forEach(b =>
    b.addEventListener('click', () => speak(b.dataset.say)));
  $('#bookList').querySelectorAll('[data-star]').forEach(b =>
    b.addEventListener('click', () => {
      const w = b.dataset.star;
      if (mastered.has(w)) { mastered.delete(w); } else { mastered.add(w); sfx.ok(); }
      store.set('cet4_mastered', [...mastered]);
      renderBook($('#bookSearch').value);
    }));
}

/* ================= 事件绑定 ================= */
document.addEventListener('keydown', e => {
  if ($('#view-quiz').classList.contains('hidden')) return;
  if (['1', '2', '3', '4'].includes(e.key)) {
    const opts = document.querySelectorAll('#qCard .opt');
    if (opts[+e.key - 1]) opts[+e.key - 1].click();
  }
});
$('#btnQuit').addEventListener('click', () => { if (confirm('确定结束本轮吗？')) endRound(); });
$('#btnAgain').addEventListener('click', () => {
  sfx.click();
  if (S.mode === 'stage' && S.stageN) startStage(S.stageN);
  else pickMode(S.mode);
});
$('#btnNextStage').addEventListener('click', e => {
  sfx.click();
  const n = +e.currentTarget.dataset.next;
  if (n) startStage(n);
});
$('#btnHome').addEventListener('click', () => { sfx.click(); renderMenu(); show('view-menu'); });
$('#btnBookBack').addEventListener('click', () => { sfx.click(); renderMenu(); show('view-menu'); });
$('#btnStageBack').addEventListener('click', () => { sfx.click(); renderMenu(); show('view-menu'); });
$('#btnRankBack').addEventListener('click', () => { sfx.click(); renderMenu(); show('view-menu'); });
$('#bookSearch').addEventListener('input', e => renderBook(e.target.value));
$('#rankName').addEventListener('input', e => {
  nickname = e.target.value.trim().slice(0, 8);
  store.set('cet4_name', nickname);
});
$('#soundToggle').addEventListener('click', () => {
  soundOn = !soundOn; store.set('cet4_sound', soundOn);
  $('#soundToggle').textContent = soundOn ? '🔊' : '🔇';
  toast(soundOn ? '音效已开启' : '音效已关闭');
  if (soundOn) sfx.click();
});

/* ================= 森林背景动效（飘叶 + 萤火虫） ================= */
(function forestFX() {
  const c = $('#forest');
  if (!c || !c.getContext) return;
  const ctx = c.getContext('2d');
  let Wp = 0, Hp = 0, dpr = 1, leaves = [], flies = [];
  const LEAF_COL = ['rgba(147,216,103,.55)', 'rgba(110,180,90,.45)',
    'rgba(190,220,120,.40)', 'rgba(80,140,80,.40)'];

  function newLeaf(init) {
    return {
      x: Math.random() * Wp,
      y: init ? Math.random() * Hp : -20,
      s: 3 + Math.random() * 5,
      vy: .35 + Math.random() * .75,
      vx: (Math.random() - .5) * .5,
      rot: Math.random() * Math.PI * 2,
      rv: (Math.random() - .5) * .03,
      sway: Math.random() * Math.PI * 2,
      col: LEAF_COL[Math.floor(Math.random() * LEAF_COL.length)]
    };
  }
  function newFly(init) {
    return {
      x: Math.random() * Wp, y: init ? Math.random() * Hp : Math.random() * Hp,
      r: .8 + Math.random() * 1.6,
      vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .3,
      ph: Math.random() * Math.PI * 2, sp: .6 + Math.random() * .8
    };
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    Wp = window.innerWidth; Hp = window.innerHeight;
    c.width = Math.floor(Wp * dpr); c.height = Math.floor(Hp * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    leaves = Array.from({ length: Wp < 600 ? 12 : 22 }, () => newLeaf(true));
    flies = Array.from({ length: Wp < 600 ? 9 : 16 }, () => newFly(true));
  }
  function leafShape(x, y, s, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.quadraticCurveTo(s * .8, 0, 0, s);
    ctx.quadraticCurveTo(-s * .8, 0, 0, -s);
    ctx.fill();
    ctx.restore();
  }
  let last = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    if (t - last < 33) return;
    last = t;
    ctx.clearRect(0, 0, Wp, Hp);

    leaves.forEach((l, i) => {
      l.sway += .02;
      l.y += l.vy * 1.6;
      l.x += l.vx + Math.sin(l.sway) * .5;
      l.rot += l.rv;
      if (l.y > Hp + 24 || l.x < -30 || l.x > Wp + 30) leaves[i] = newLeaf(false);
      ctx.fillStyle = l.col;
      leafShape(l.x, l.y, l.s, l.rot);
    });

    flies.forEach(f => {
      f.ph += .03 * f.sp;
      f.x += f.vx; f.y += f.vy;
      if (f.x < -20) f.x = Wp + 20; else if (f.x > Wp + 20) f.x = -20;
      if (f.y < -20) f.y = Hp + 20; else if (f.y > Hp + 20) f.y = -20;
      const a = (Math.sin(f.ph) + 1) / 2;
      const gr = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r * 7);
      gr.addColorStop(0, `rgba(255,232,140,${.55 * a})`);
      gr.addColorStop(.45, `rgba(255,215,110,${.16 * a})`);
      gr.addColorStop(1, 'rgba(255,215,110,0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(255,246,205,${.72 * a})`;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    });
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();

renderMenu();
</script>
